name: Build AdelPrinter APK

# Compile l'APK debug à chaque push, et manuellement via le bouton "Run workflow".
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1) Récupère le code du dépôt
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Installe le JDK 17 (requis par Android Gradle Plugin 8.x)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3) Configure le SDK Android à partir de celui déjà préinstallé sur le
      #    runner ubuntu-latest (on n'utilise plus android-actions/setup-android :
      #    cette action échoue avec "Wrong version in preinstalled sdkmanager"
      #    depuis la mise à jour de l'image du runner qui embarque un cmdline-tools
      #    plus récent que celui que l'action attend). On accepte simplement les
      #    licences et on installe la platform/les build-tools nécessaires avec
      #    le sdkmanager déjà présent.
      - name: Set up Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | sort -V | tail -n1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager introuvable sur le runner" >&2
            exit 1
          fi
          echo "Utilisation de: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # 4) Rend le wrapper Gradle exécutable
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 5) Compile l'APK debug (télécharge Gradle/dépendances automatiquement)
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 6) Publie l'APK comme artefact téléchargeable
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdelPrinter-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
