name: Build AdelPrinter APK

# Compile l'APK debug à chaque push, et manuellement via le bouton "Run workflow".
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1) Récupère le code du dépôt
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Installe le JDK 17 (requis par Android Gradle Plugin 8.x)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3) Installe le SDK Android + build-tools + platform (automatique)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4) Rend le wrapper Gradle exécutable
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 5) Compile l'APK debug (télécharge Gradle/dépendances automatiquement)
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 6) Publie l'APK comme artefact téléchargeable
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdelPrinter-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
